# Publishes to PyPI when a GitHub release is published, with PyPI's trusted
# publishing (no API token). One-time setup on PyPI: add a trusted publisher
# for this repository (owner plumlang, repository pygments-plum, workflow
# publish.yml, environment pypi), and create the `pypi` environment in this
# repository's settings. The release tag must match the version in
# pygments_plum/__init__.py, like v0.1.0.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pygments_plum/__init__.py)
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pygments-plum/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
